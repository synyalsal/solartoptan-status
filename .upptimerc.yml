# Solar Toptan servis durumu - https://github.com/synyalsal/solartoptan-status
# Bağımsız çalışır: kontroller GitHub Actions'ta (5 dk), sayfa GitHub Pages'ta.
# Solar Toptan sunucuları veya vitrin çökse bile bu sayfa açık kalır.
# Ana repo dokümanı: solartoptan/docs/durum-sayfasi.md
owner: synyalsal
repo: solartoptan-status

# Kural: kullanıcıya görünen adlarda kullandığımız dış servislerin adı geçmez.
sites:
  - name: Vitrin
    url: https://solartoptan.com/
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/store.svg
    maxResponseTime: 5000
  - name: Ürün Kataloğu
    url: https://solartoptan.com/store
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/package.svg
    maxResponseTime: 5000
  - name: Kategoriler
    url: https://solartoptan.com/categories
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/layout-grid.svg
    maxResponseTime: 5000
  - name: Ürün Arama
    url: https://solartoptan.com/api/search
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/search.svg
    method: POST
    headers:
      - "Content-Type: application/json"
    body: '{"queries":[{"entity":"product","pagination":{"take":1}}]}'
    maxResponseTime: 5000
  - name: Fiyat Servisi
    url: https://solartoptan.com/api/prices
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/tag.svg
    method: POST
    headers:
      - "Content-Type: application/json"
    body: '{"ids":["prod_status_check"]}'
    maxResponseTime: 5000
  # Backend hazırlık kontrolü (/health/ready): veritabanı + Redis; biri
  # çökerse 503. /health (liveness) kullanılmaz - sabit "OK" döner.
  - name: Sipariş ve Hesap Sistemi
    url: https://api.solartoptan.com/health/ready
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/server.svg
    maxResponseTime: 5000
  # Worker kalp atışı 3 dk'dan eskiyse 503 (cron/kuyruk durmuş).
  - name: Arka Plan İşleri
    url: https://api.solartoptan.com/health/ready?component=worker
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/cpu.svg
    maxResponseTime: 5000
  - name: Ürün Görselleri
    url: https://cdn.solartoptan.com/11-16-01M6DYJG26098KY0BTWVH2KVE9.png
    icon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/icons/image.svg
    maxResponseTime: 5000

# Kesinti olunca açılan olay kaydı bu kişiye atanır (GitHub bildirimi = alarm).
assignees:
  - synyalsal

status-website:
  # Cloudflare DNS: status CNAME synyalsal.github.io, proxy KAPALI (gri bulut).
  cname: status.solartoptan.com
  logoUrl: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/logo.svg
  favicon: https://raw.githubusercontent.com/synyalsal/solartoptan-status/master/assets/favicon.ico
  name: Solar Toptan Servis Durumu
  introTitle: "**Solar Toptan** servis durumu"
  introMessage: "Vitrin, sipariş, fiyat ve arama servislerimizin anlık durumu. Kontroller her 5 dakikada bir, Solar Toptan altyapısından **bağımsız** olarak yapılır. Tüm saatler Türkiye saatidir (UTC+3)."
  theme: night
  # Vitrinle uyumlu nötr koyu palet (zinc) - night temasının renklerini ezer.
  # MOBİL UYUM (kurallar 6.6): 640px altı için ayrı kurallar - değiştirince
  # 390px genişlikte tarayıcıda kontrol et.
  css: ":root{--body-background-color:#09090b;--body-text-color:#e4e4e7;--card-background-color:#18181b;--card-border-color:#27272a;--nav-background-color:#09090b;--nav-border-bottom-color:#27272a;--nav-current-border-bottom-color:#10b981;--up-border-left-color:#10b981;--tag-up-background-color:#10b981;--tag-color:#09090b} a{color:#a1a1aa} article h4 a{color:#f4f4f5} .changed,.status,article{border-radius:12px} article.graph{background-image:linear-gradient(rgba(24,24,27,.45),rgba(24,24,27,.45)),var(--background)!important} footer{padding:0 1rem;text-align:center} footer p{white-space:normal;overflow-wrap:anywhere} @media (max-width:640px){nav{overflow-x:visible!important;padding:0 .75rem!important}nav .container{display:flex!important;align-items:center;justify-content:space-between;gap:.5rem}nav .logo>div{display:none!important}nav ul{display:flex!important;gap:.25rem;margin:0!important;padding:0!important}nav ul li a{padding-left:.5rem!important;padding-right:.5rem!important;font-size:.9rem}article.graph{background-size:100% 36px!important;background-position:left bottom!important;padding-bottom:3.25rem!important}}"
  # Son kontrol zamanı + TR saati (2026-11-12, kullanıcı isteği):
  # - Her sayfanın başında son başarılı "Uptime CI" çalışmasının zamanı
  #   (TR saati, UTC+3), Worker /son-kontrol ucundan (GitHub API tarayıcıdan çağrılmaz). Upptime durum değişmedikçe commit atmadığı için
  #   kontrolün çalıştığı sayfadan anlaşılmıyordu. 20 dk'dan eskiyse sarı.
  # - Sayfadaki tüm tarih/saatler (grafik, olaylar) ziyaretçinin saat
  #   diliminden bağımsız TR saatiyle gösterilir (kurallar 6.1, 6.11).
  # Kaynak: solartoptan reposu infra/status-tetik/son-kontrol.js
  js: "(function(){if(window.__trTz)return;window.__trTz=1;var TZ='Europe/Istanbul';['toLocaleString','toLocaleDateString','toLocaleTimeString'].forEach(function(f){var o=Date.prototype[f];Date.prototype[f]=function(l,op){var x=Object.assign({},op||{});if(!x.timeZone)x.timeZone=TZ;return o.call(this,l,x)}});var D=Intl.DateTimeFormat;var P=function(l,op){var x=Object.assign({},op||{});if(!x.timeZone)x.timeZone=TZ;return new D(l,x)};P.prototype=D.prototype;P.supportedLocalesOf=D.supportedLocalesOf;Intl.DateTimeFormat=P})();(function(){var ID='son-kontrol',K='sk-cache',R='synyalsal/solartoptan-status',last=null,busy=false;function fmt(d){var p=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(function(x){o[x.type]=x.value});return o.day+'.'+o.month+'.'+o.year+' '+o.hour+':'+o.minute}function ago(d){var m=Math.round((Date.now()-d.getTime())/60000);if(m<1)return'az önce';if(m<60)return m+' dk önce';var h=Math.floor(m/60);if(h<24)return h+' sa '+(m%60)+' dk önce';return Math.floor(h/24)+' gün önce'}function render(){if(!last)return;var m=document.querySelector('main');if(!m)return;var el=document.getElementById(ID);if(!el){el=document.createElement('p');el.id=ID;el.style.cssText='margin:.75rem 0 1rem;font-size:.9rem;color:#a1a1aa';m.insertBefore(el,m.firstChild)}var d=new Date(last),old=(Date.now()-d.getTime())>20*60000;var h='Son kontrol: <strong style=\"color:'+(old?'#f59e0b':'#e4e4e7')+'\">'+fmt(d)+'</strong> (TR saati, UTC+3) · '+ago(d)+(old?' (gecikmeli)':'')+' · kontroller 5 dakikada bir';if(el.innerHTML!==h)el.innerHTML=h}function load(){try{var c=JSON.parse(sessionStorage.getItem(K)||'null');if(c&&Date.now()-c.at<60000){last=c.t;render();return}}catch(e){}if(busy)return;busy=true;fetch('https://solartoptan-status-tetik.sbso.workers.dev/son-kontrol').then(function(r){return r.json()}).then(function(j){if(!j||!j.t)return;last=j.t;try{sessionStorage.setItem(K,JSON.stringify({at:Date.now(),t:last}))}catch(e){}render()}).catch(function(){}).then(function(){busy=false})}load();setInterval(load,60000);new MutationObserver(function(){if(!document.getElementById(ID))render()}).observe(document,{childList:true,subtree:true})})();"
  navbar:
    - title: Durum
      href: /
    - title: solartoptan.com
      href: https://solartoptan.com

